[build]
  publish = "."

# Production HTTP Security & Performance Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; child-src 'self' https://www.google.com https://maps.google.com; frame-src 'self' https://www.google.com https://maps.google.com; font-src 'self' https://fonts.gstatic.com https://fonts.googleapis.com data:;"

# Long-term Asset Caching for high Core Web Vitals
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Netlify Form submissions handling
[forms]
  enabled = true
