<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 100" width="580" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3" />
      <stop offset="35%" stop-color="#E5C158" />
      <stop offset="70%" stop-color="#B88A2D" />
      <stop offset="100%" stop-color="#E5C158" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sacred Emblem Graphic -->
  <g transform="translate(15, 10)">
    <!-- Outer Zodiac Aura Ring -->
    <circle cx="40" cy="40" r="38" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.8" />
    <circle cx="40" cy="40" r="32" fill="#0D1527" stroke="url(#goldGrad)" stroke-width="1.5" />
    <!-- Sacred Om Motif -->
    <text x="40" y="52" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="34" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" filter="url(#goldGlow)">ॐ</text>
    <!-- Little Sun rays / stars -->
    <circle cx="40" cy="4" r="2.5" fill="#FFF2A3" />
    <circle cx="76" cy="40" r="2.5" fill="#FFF2A3" />
    <circle cx="40" cy="76" r="2.5" fill="#FFF2A3" />
    <circle cx="4" cy="40" r="2.5" fill="#FFF2A3" />
  </g>

  <!-- Brand Typography: Business Name Prominent -->
  <g transform="translate(110, 24)">
    <!-- Main Business Name -->
    <text x="0" y="20" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="20" font-weight="800" letter-spacing="1.5" fill="url(#goldGrad)">ASTROLOGER PSYCHIC</text>
    <text x="0" y="42" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="18.5" font-weight="800" letter-spacing="1.8" fill="#F8F6F0">&amp; SPIRITUAL HEALER</text>
    <!-- Master Ganesh & Location Tag -->
    <text x="1" y="60" font-family="'Inter', 'Segoe UI', sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#E5C158">MASTER: GANESH &bull; SPARTANBURG, SC</text>
  </g>
</svg>
